<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="bmi-calculator.css">
    <link rel="stylesheet" href="health-tools.css">
</head>

<body>
    <div class="bmi-container">
        <header class="bmi-header">
            <button type="button" class="btn secondary back-link" onclick="history.back()">← Go Back</button>
            <h1>BMI Calculator</h1>
            <p>Enter your height and weight to calculate your Body Mass Index (BMI).</p>
        </header>

        <div class="bmi-chart" id="bmiChart" aria-hidden="false">
            <div class="chart-labels">
                <span>Underweight<br><small>&lt;18.5</small></span>
                <span>Normal<br><small>18.5–24.9</small></span>
                <span>Overweight<br><small>25–29.9</small></span>
                <span>Obesity<br><small>≥30</small></span>
            </div>
            <div class="chart-bar">
                <div class="segment underweight" data-min="12" data-max="18.5"></div>
                <div class="segment normal" data-min="18.5" data-max="24.9"></div>
                <div class="segment overweight" data-min="25" data-max="29.9"></div>
                <div class="segment obesity" data-min="30" data-max="60"></div>
                <div class="marker" id="bmiMarker" style="left:0%" aria-hidden="true">
                    <span class="pin">●</span>
                    <span class="value" id="bmiMarkerVal"></span>
                </div>
            </div>
        </div>

        <main class="bmi-card">
            <form id="bmiForm" class="bmi-form">
                <div class="field">
                    <label for="weight">Weight</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input id="weight" type="number" step="0.1" min="1" placeholder="e.g. 70" required>
                        <select id="weightUnit" class="unit-select" aria-label="Weight unit">
                            <option value="kg" selected>kg</option>
                            <option value="lb">lb</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="height">Height</label>
                    <div class="unit-row">
                        <input id="height" type="number" step="0.01" min="0.3" placeholder="e.g. 175" required>
                        <select id="heightUnit" class="unit-select" aria-label="Height unit">
                            <option value="cm" selected>cm</option>
                            <option value="m">m</option>
                            <option value="in">in</option>
                        </select>
                    </div>
                    <small class="helper">Enter height in the selected unit</small>
                </div>

                <div class="field actions">
                    <button type="submit" class="btn primary">Calculate BMI</button>
                    <button type="button" id="clearBtn" class="btn secondary">Clear</button>
                </div>
            </form>

            <div id="bmiResult" class="bmi-result" aria-live="polite" style="display:none;"></div>
                        <div class="tool-actions" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
                                <a href="chat.html?doctor=BMI+Consult&hideClose=1" class="btn primary chat" data-doctor="BMI Consultation" data-hide-close="true">Chat with Doctor</a>
                                <a href="#" class="btn secondary call">Call Doctor</a>
                        </div>
        </main>
    </div>

        <!-- Chat and Call modals are provided by the main site; BMI page uses chat/call links only -->

    <script>
    document.addEventListener('DOMContentLoaded', function(){
        function classifyBMI(bmi) {
            if (bmi < 18.5) return 'Underweight';
            if (bmi < 25) return 'Normal weight';
            if (bmi < 30) return 'Overweight';
            return 'Obesity';
        }

        function updateChart(bmi) {
            const chart = document.getElementById('bmiChart');
            if (!chart) return;
            const min = 12, max = 60; // display scale
            const segments = chart.querySelectorAll('.segment');
            segments.forEach(seg => {
                const smin = parseFloat(seg.dataset.min);
                const smax = parseFloat(seg.dataset.max);
                const w = Math.max(0, ((smax - smin) / (max - min)) * 100);
                seg.style.width = w + '%';
            });
            const marker = document.getElementById('bmiMarker');
            const val = document.getElementById('bmiMarkerVal');
            if (!marker || !val) return;
            if (!bmi || isNaN(bmi)) {
                marker.style.display = 'none';
                val.textContent = '';
                return;
            }
            const clamped = Math.max(min, Math.min(max, bmi));
            const pos = ((clamped - min) / (max - min)) * 100;
            marker.style.display = 'block';
            marker.style.left = `calc(${pos}% - 10px)`; // offset for pin
            val.textContent = bmi;
        }

        // elements
        const weightUnitEl = document.getElementById('weightUnit');
        const weightEl = document.getElementById('weight');
        const bmiForm = document.getElementById('bmiForm');
        const clearBtn = document.getElementById('clearBtn');
        const result = document.getElementById('bmiResult');

        if (weightUnitEl && weightEl) {
            weightUnitEl.addEventListener('change', function(){
                const u = weightUnitEl.value;
                if (u === 'kg') { weightEl.placeholder = 'e.g. 70'; weightEl.step = '0.1'; }
                else { weightEl.placeholder = 'e.g. 154'; weightEl.step = '0.1'; }
            });
        }

        if (bmiForm) {
            bmiForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const rawWeight = parseFloat(document.getElementById('weight').value);
                const weightUnit = (document.getElementById('weightUnit') && document.getElementById('weightUnit').value) || 'kg';
                const weight = (weightUnit === 'lb') ? (rawWeight * 0.45359237) : rawWeight; // convert lb -> kg
                const heightVal = parseFloat(document.getElementById('height').value);
                const heightUnit = (document.getElementById('heightUnit') && document.getElementById('heightUnit').value) || 'cm';
                if (!weight || !heightVal) return;
                let heightM = 0;
                if (heightUnit === 'cm') heightM = heightVal / 100;
                else if (heightUnit === 'm') heightM = heightVal;
                else if (heightUnit === 'in') heightM = heightVal * 0.0254;
                const bmi = weight / (heightM * heightM);
                const rounded = Math.round(bmi * 10) / 10;
                const category = classifyBMI(rounded);

                const suggestions = {
                    'Underweight': {
                        diet: [
                            'Increase caloric intake with nutrient-dense foods (nuts, avocados, whole grains).',
                            'Add frequent small meals and include healthy snacks.',
                            'Include protein at every meal (eggs, dairy, legumes, lean meats).'
                        ],
                        exercise: [
                            'Light resistance training 2–3× weekly to build muscle mass.',
                            'Avoid excessive cardio until weight improves; focus on strength.'
                        ],
                        notes: 'Consult a dietitian for a personalized meal plan if weight gain is difficult.'
                    },
                    'Normal weight': {
                        diet: [
                            'Maintain a balanced diet with vegetables, lean proteins, whole grains, and healthy fats.',
                            'Monitor portion sizes and stay hydrated.'
                        ],
                        exercise: [
                            'Aim for 150 minutes of moderate aerobic activity weekly plus 2 strength sessions.',
                            'Include flexibility and balance exercises.'
                        ],
                        notes: 'Continue regular health checks; focus on balanced lifestyle.'
                    },
                    'Overweight': {
                        diet: [
                            'Reduce refined carbs and added sugars; increase fiber-rich foods.',
                            'Prefer lean proteins, vegetables, and whole grains; control portion sizes.'
                        ],
                        exercise: [
                            'Aim for 150–300 minutes of moderate activity per week.',
                            'Incorporate strength training 2× weekly to preserve lean mass.'
                        ],
                        notes: 'Small, sustainable changes are more effective than drastic diets.'
                    },
                    'Obesity': {
                        diet: [
                            'Consult a healthcare provider or dietitian for a structured weight-loss plan.',
                            'Adopt a calorie-controlled, nutrient-dense dietary pattern; limit ultra-processed foods.'
                        ],
                        exercise: [
                            'Start with low-impact aerobic activity (walking, swimming) and gradually increase duration.',
                            'Add resistance training as tolerated; seek professional guidance if needed.'
                        ],
                        notes: 'Consider medical review for comorbidities and discuss referral options.'
                    }
                };

                const s = suggestions[category] || suggestions['Normal weight'];

                result.style.display = 'block';
                result.innerHTML = `
                    <h3>Your BMI: ${rounded}</h3>
                    <p class="category">Category: <strong>${category}</strong></p>
                    <div class="suggestions">
                        <div class="suggestion-section">
                            <h4>Diet suggestions</h4>
                            <ul>${s.diet.map(item => `<li>${item}</li>`).join('')}</ul>
                        </div>
                        <div class="suggestion-section">
                            <h4>Exercise suggestions</h4>
                            <ul>${s.exercise.map(item => `<li>${item}</li>`).join('')}</ul>
                        </div>
                        <div class="suggestion-section">
                            <h4>Notes</h4>
                            <p>${s.notes}</p>
                        </div>
                    </div>
                `;

                // update visual chart marker
                try { updateChart(rounded); } catch (err) { /* ignore */ }
            });
        }

        if (clearBtn) {
            clearBtn.addEventListener('click', function () {
                if (bmiForm) bmiForm.reset();
                result.style.display = 'none'; result.innerHTML = '';
                try { updateChart(null); } catch (err) {}
            });
        }

                // initialize chart segments
                try{ updateChart(null); }catch(e){}
                // Call modal handling for this standalone BMI page (uses static modal below)
                document.addEventListener('click', function(e){
                        const callLink = e.target.closest && e.target.closest('a.call');
                        const closeButton = e.target.closest && e.target.closest('.modal-close');
                        const overlay = e.target.closest && e.target.closest('.modal');
                        if (callLink) { e.preventDefault(); document.getElementById('callModalLocal').style.display = 'block'; }
                        if (closeButton) { e.preventDefault(); closeButton.closest('.modal').style.display = 'none'; }
                        if (overlay && e.target === overlay) overlay.style.display = 'none';
                });
                document.getElementById && document.getElementById('audioCall') && document.getElementById('audioCall').addEventListener('click', function(){ alert('Starting audio call (demo).'); document.getElementById('callModalLocal').style.display='none'; });
                document.getElementById && document.getElementById('videoCall') && document.getElementById('videoCall').addEventListener('click', function(){ alert('Starting video call (demo).'); document.getElementById('callModalLocal').style.display='none'; });
    });
    </script>
        <!-- rely on global chat modal when available; BMI includes a local call modal below -->

        <!-- Local Call modal for BMI page -->
        <div id="callModalLocal" class="modal" role="dialog" aria-hidden="true" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Call Doctor</h2>
                    <button class="modal-close" aria-label="Close">✕</button>
                </div>
                <div class="modal-body">
                    <p>Choose how you'd like to connect with a doctor.</p>
                    <div class="modal-actions">
                        <button type="button" class="btn secondary" id="audioCall">Audio Call</button>
                        <button type="button" class="btn secondary" id="videoCall">Video Call</button>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
